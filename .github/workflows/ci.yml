name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile sources
        run: python -m compileall -q src scripts
      - name: Unit tests without model dependencies
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  integration:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      ANONYMIZED_TELEMETRY: 'False'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.8
          uv sync --locked
      - name: Run tests including real Chroma
        run: uv run --offline python -m unittest discover -s tests -v
      - name: Validate evaluation references
        run: uv run --offline python -m aws_rag evaluate --validate-only
      - name: Build distribution
        run: uv build
